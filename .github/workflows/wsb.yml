name: wsb
# Round 50 (PROTOCOL_ROUND50.md): hourly Reddit mention snapshots (ApeWisdom). Self-chaining.
on:
  workflow_dispatch:
    inputs:
      seconds: {description: "run length", default: "20400"}
      chain: {description: "start the next job when done", default: "yes"}
permissions:
  contents: write
  actions: write
concurrency:
  group: wsb
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      WSB_COMMIT: "1"
      WSB_SECONDS: ${{ inputs.seconds || '20400' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "claude/eloquent-darwin-2lipsh"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: |
          git config user.name "wsb bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python -m edge.wsb
      - name: Score the crowd-emotion strategies (Round 50)
        if: always()
        run: |
          python -m edge.wsb_score > /dev/null || echo "scorer failed"
          git add reports/ROUND50.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round50: score [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Start the next job
        if: always() && (inputs.chain || 'yes') == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          for i in 1 2 3; do gh workflow run wsb.yml --ref claude/eloquent-darwin-2lipsh && exit 0; sleep 20; done
