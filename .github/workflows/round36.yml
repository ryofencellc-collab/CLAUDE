name: round36
# Round 36 (PROTOCOL_ROUND36.md): retail-behavior anomaly battery on ~3,000 US stocks.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python run_round36.py data
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r36-data, path: data/r36/}
      - run: python run_round36.py run
      - name: Commit report
        if: always()
        run: |
          git config user.name "round36 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND36.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round36: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
