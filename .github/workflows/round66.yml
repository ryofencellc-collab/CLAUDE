name: round66
# Round 66 (PROTOCOL_ROUND66.md): 0DTE million-way search on 14 years of S&P minutes, options priced by a model calibrated to real 0DTE quotes.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate scipy
      - uses: actions/cache@v4
        with:
          path: data/histdata
          key: histdata-nsx-spx-v1-${{ github.run_id }}
          restore-keys: |
            histdata-nsx-spx-v1-
            histdata-nsxusd-v1-
      - run: python fetch_nq.py
      - run: PAIR=spxusd python fetch_nq.py
      - name: Smoke (synthetic null fails, planted passes)
        run: python run_round66.py smoke > /dev/null
      - name: Full search
        run: python run_round66.py report
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r66-tables, path: "data/r66_*.npz", retention-days: 30, if-no-files-found: ignore}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round66 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND66.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round66: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
