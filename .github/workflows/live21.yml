name: live21
# Live trader for the Round 21/22 edge (edge/live21.py). DRY unless the repository variable LIVE21 is "1"
# AND the Kalshi secrets exist. Each job loops ~5.75 h; the next scheduled run queues behind it.
on:
  schedule:
    - cron: "50 */3 * * *"
  workflow_dispatch:
    inputs:
      seconds: {description: "loop length in seconds", default: "20700"}
      selftest: {description: "1 = only run the 1-contract, 1c order check and exit", default: "0"}
permissions:
  contents: write
  actions: write
concurrency:
  group: live21
  cancel-in-progress: false
jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      LIVE21: ${{ vars.LIVE21 }}
      LIVE21_MAX: ${{ vars.LIVE21_MAX || '1000' }}
      LIVE21_SECONDS: ${{ inputs.seconds || '20700' }}
      KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
      KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "live21 bot"
          git config user.email "actions@users.noreply.github.com"
      - if: ${{ inputs.selftest == '1' }}
        run: python -m edge.live21 selftest
      - if: ${{ inputs.selftest != '1' }}
        run: python -m edge.live21
      - name: Commit log
        if: always()
        run: |
          git config user.name "live21 bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper/live21_log.csv paper/live21_state.json paper/LIVE21.md 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "live21: log $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Start the next run (GitHub's cron is unreliable; the concurrency group queues it)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 300; fi  # no tight loop when a job keeps failing
          gh workflow run live21.yml --ref "${{ github.ref_name }}" || echo "could not queue next run"
