name: round47
# Round 47 (PROTOCOL_ROUND47.md): rules from community Claude trading skills, backtested on the Round 38 stock panel.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - uses: actions/download-artifact@v4
        with: {name: r38-data, path: data/r38, run-id: "42527455413", github-token: "${{ github.token }}"}
      - run: ls -la data/r38 | head -20
      - run: python run_round47.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round47 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND47.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round47: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
