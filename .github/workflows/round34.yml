name: round34
# Round 34 (PROTOCOL_ROUND34.md): whale autopsy on Polymarket's public data.
on:
  workflow_dispatch:
    inputs:
      part: {description: "'' = autopsy, 'b' = trade-by-trade deep dive", default: ""}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python run_round34${{ inputs.part }}.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r34-raw, path: data/r34/}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round34 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND34.md reports/ROUND34.csv reports/ROUND34B.md probe/r34b_debug.json 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round34: whale autopsy [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
