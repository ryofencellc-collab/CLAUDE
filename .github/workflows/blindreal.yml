name: blindreal
# Segment scanner on real S&P + Nasdaq (PROTOCOL_BLIND.md).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate pyarrow scipy
      - uses: actions/cache@v4
        with:
          path: data/histdata
          key: histdata-nsx-spx-v1-${{ github.run_id }}
          restore-keys: |
            histdata-nsx-spx-v1-
            histdata-nsxusd-v1-
      - run: python fetch_nq.py
      - run: PAIR=spxusd python fetch_nq.py
      - name: Smoke (synthetic blind data, no network)
        run: python gen_blind.py && python run_blind.py scan > /dev/null && git checkout reports/blind_scan.md
      - name: Real-data scan
        run: python run_scan_real.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "blindreal bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/SCAN_REAL.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "blindreal: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
