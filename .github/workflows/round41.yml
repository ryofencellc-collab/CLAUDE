name: round41
# Round 41 (PROTOCOL_ROUND41.md): adverse-selection cancel rules.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python run_round41.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r41-flow, path: data/r41/flow.pkl, if-no-files-found: warn}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round41 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND41.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round41: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
