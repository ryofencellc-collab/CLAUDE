name: round63
# Round 63 (PROTOCOL_ROUND63.md): chart #1 incumbent repeat vs price.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - name: Smoke (planted edge passes, null fails; no network)
        run: python run_round63.py smoke
      - name: Collect chart markets + incumbent trades
        run: R63_BUDGET_MIN=280 python run_round63.py collect
      - name: Analyze
        run: python run_round63.py analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r63-data, path: data/r63/}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round63 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND63.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round63: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
