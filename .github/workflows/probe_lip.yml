name: probe_lip
# One-off: liquidity-incentive rules and books.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && python probe_lip.py
      - name: Commit
        run: |
          git config user.name "probe bot"; git config user.email "actions@users.noreply.github.com"
          git add probe/lip && git commit -q -m "probe: lip books [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
