name: probe_wsb
# One-off: Reddit-sentiment data sources reachable without touching reddit.com (ApeWisdom, HF, Kaggle).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - run: |
          mkdir -p probe/wsb2
          {
          for u in "https://huggingface.co/api/datasets/DataDump1/wallstreetbets_reddit/tree/main" \
                   "https://huggingface.co/api/datasets/zchengc/wsb_full/tree/main" \
                   "https://huggingface.co/api/datasets/ysramen/wsbreddit/tree/main" \
                   "https://huggingface.co/api/datasets/Sentdex/wsb_reddit_v002/tree/main" \
                   "https://huggingface.co/datasets/DataDump1/wallstreetbets_reddit/resolve/main/README.md" \
                   "https://huggingface.co/datasets/zchengc/wsb_full/resolve/main/README.md"; do
            echo "== $u"
            curl -sS -m 60 -A "Mozilla/5.0 (research)" -o body -w "HTTP %{http_code} %{size_download}\n" "$u"
            python3 probe_wsb.py
            sleep 2
          done
          } > probe/wsb2/report.txt 2>&1
          cat probe/wsb2/report.txt
      - run: |
          git config user.name "probe bot"; git config user.email "actions@users.noreply.github.com"
          git add probe/wsb2 && git commit -q -m "probe: wsb sources [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
