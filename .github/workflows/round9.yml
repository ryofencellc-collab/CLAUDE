name: round9
# Round 9 (PROTOCOL_ROUND9.md): data-chosen trade gates, judged walk-forward.
on:
  workflow_dispatch:
    inputs:
      small: {description: "1 = smoke test", default: "1"}
      market: {description: "crypto or stocks", default: "crypto"}
permissions:
  contents: write
concurrency: round9-${{ inputs.market }}-${{ inputs.small }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R9_SMALL: ${{ inputs.small }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_gates.py
      - run: python ${{ inputs.market == 'stocks' && 'run_round9b.py' || 'run_round9.py' }}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round9 bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND9* || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "round9: ${{ inputs.market }} results (run ${{ github.run_id }}, small=${{ inputs.small }})"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
