name: round59
# Round 59 (PROTOCOL_ROUND59.md): do Hyperliquid's top traders keep winning? 3 collection shards + analysis.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: {shard: [0, 1, 2]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - name: Smoke (null fails, planted skill passes; no network)
        run: python run_round59.py smoke
      - run: python run_round59.py collect ${{ matrix.shard }} 3
      - uses: actions/upload-artifact@v4
        with: {name: "r59-${{ matrix.shard }}", path: data/r59/}
  analyze:
    needs: [collect]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - uses: actions/download-artifact@v4
        with: {pattern: "r59-*", path: data/r59, merge-multiple: true}
      - run: python run_round59.py analyze
      - uses: actions/upload-artifact@v4
        with: {name: r59-all, path: data/r59/}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round59 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND59.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round59: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
