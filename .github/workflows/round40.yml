name: round40
# Round 40 (PROTOCOL_ROUND40.md): hourly z>=6 empirical loss rate.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python run_round40.py
      - name: Commit report
        run: |
          git config user.name "round40 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND40.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round40: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
