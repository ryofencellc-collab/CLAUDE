name: odte
# Round 39 collector (PROTOCOL_ROUND39.md): free Cboe delayed 0DTE quotes, Mon-Fri 12:50-21:20 UTC.
# Self-chaining: each job collects (or waits for the next window) and then starts the next job, so it does not
# depend on GitHub's cron (which skipped the first day). The cron stays as a backup; the concurrency group merges chains.
on:
  schedule:
    - cron: "50 12 * * 1-5"
  workflow_dispatch:
    inputs:
      max_seconds: {description: "collection length (smoke test: small)", default: "20400"}
      start_utc: {description: "override today's window start HH:MM (UTC)", default: ""}
      chain: {description: "start the next job when done", default: "yes"}
permissions:
  contents: write
  actions: write
concurrency:
  group: odte
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ODTE_COMMIT: "1"
      ODTE_MAX_SECONDS: ${{ inputs.max_seconds || '20400' }}
      ODTE_START_UTC: ${{ inputs.start_utc || '' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "claude/eloquent-darwin-2lipsh"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests yfinance tabulate
      - run: |
          git config user.name "odte bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python -m edge.odte
      - name: Score the 0DTE strategies (Round 39b)
        if: always()
        run: |
          python -m edge.odte_score > /dev/null || echo "scorer failed"
          git add reports/ROUND39B.md paper/r39b_trades.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round39b: daily score [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "odte-${{ github.run_id }}", path: data/odte/, retention-days: 90, if-no-files-found: ignore}
      - name: Start the next job
        if: always() && (inputs.chain || 'yes') == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          for i in 1 2 3; do gh workflow run odte.yml --ref claude/eloquent-darwin-2lipsh && exit 0; sleep 20; done
