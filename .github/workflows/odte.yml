name: odte
# Round 39 collector (PROTOCOL_ROUND39.md): free Cboe delayed 0DTE quotes, Mon-Fri.
# Two jobs per day cover 13:20-21:20 UTC; each writes its own part file.
on:
  schedule:
    - cron: "20 13 * * 1-5"
    - cron: "55 18 * * 1-5"
  workflow_dispatch:
    inputs:
      max_seconds: {description: "smoke-test length", default: "20400"}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ODTE_COMMIT: "1"
      ODTE_MAX_SECONDS: ${{ inputs.max_seconds || '20400' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "claude/eloquent-darwin-2lipsh"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests
      - run: |
          git config user.name "odte bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python -m edge.odte
