name: fillcheck
# Recount past paper fills with only the trades that can reach a 99c bid (edge/fillcheck.py).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python -m edge.fillcheck
      - name: Commit
        if: always()
        run: |
          git config user.name "fillcheck bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/FILLCHECK.md reports/FILLCHECK.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "fillcheck: report [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
