name: round45
# Round 45 (PROTOCOL_ROUND45.md): Kalshi maker returns by category x price x time-to-close.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python run_round45.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r45-trades, path: data/r45/trades.pkl, if-no-files-found: warn}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round45 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND45.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round45: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
