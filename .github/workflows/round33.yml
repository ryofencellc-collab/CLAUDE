name: round33
# Round 33 (PROTOCOL_ROUND33.md): price-honesty map of Kalshi from real hourly quotes.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python run_round33.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round33 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND33.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round33: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
