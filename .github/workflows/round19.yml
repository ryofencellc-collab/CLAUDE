name: round19
# Round 19 (PROTOCOL_ROUND19.md): Round 18 trade on other daily-temperature series.
on:
  workflow_dispatch:
    inputs:
      small: {description: "1 = four series, 60 days", default: "1"}
permissions:
  contents: write
concurrency: round19-${{ inputs.small }}
env:
  R19_SMALL: ${{ inputs.small }}
  R15_MAX_PRICE: "0.99"
  R15_MODE: "maker"
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.s.outputs.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - id: s
        run: echo "series=$(python run_round19.py list | tail -1)" >> "$GITHUB_OUTPUT"
  fetch:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        series: ${{ fromJson(needs.list.outputs.series) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run_round19.py fetch ${{ matrix.series }}
      - uses: actions/upload-artifact@v4
        with: {name: "r19-${{ matrix.series }}", path: data/r19/}
  report:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: "r19-*", path: data/r19, merge-multiple: true}
      - run: python run_round19.py report
      - name: Commit report
        if: always()
        run: |
          git config user.name "round19 bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND19* || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "round19: results (run ${{ github.run_id }}, small=${{ inputs.small }})"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
