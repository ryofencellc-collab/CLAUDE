name: round15
# Round 15 (PROTOCOL_ROUND15.md): Kalshi weather first-money-in, one job per city.
on:
  workflow_dispatch:
    inputs:
      small: {description: "1 = New York, 60 days", default: "1"}
permissions:
  contents: write
concurrency: round15-${{ inputs.small }}
env:
  R15_SMALL: ${{ inputs.small }}
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      series: ${{ steps.s.outputs.series }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - id: s
        run: echo "series=$(python run_round15.py list | tail -1)" >> "$GITHUB_OUTPUT"
  fetch:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        series: ${{ fromJson(needs.list.outputs.series) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run_round15.py fetch ${{ matrix.series }}
      - uses: actions/upload-artifact@v4
        with: {name: "r15-${{ matrix.series }}", path: data/r15/}
  report:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: "r15-*", path: data/r15, merge-multiple: true}
      - run: python run_round15.py report
      - name: Commit report
        if: always()
        run: |
          git config user.name "round15 bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND15* || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "round15: results (run ${{ github.run_id }}, small=${{ inputs.small }})"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
