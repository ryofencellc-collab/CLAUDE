name: probe_odte_syms
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests && python probe_odte_syms.py
