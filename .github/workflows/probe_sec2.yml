name: probe_sec2
# One-off: find the working URL for SEC insider-transaction data sets from Actions.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - run: |
          mkdir -p probe/sec3; UA="ryofencellc-collab-research 265339802+ryofencellc-collab@users.noreply.github.com"
          {
          for u in "http://openinsider.com/screener?fd=1461&xp=1&cnt=100&page=1&sortcol=0" \
                   "http://openinsider.com/latest-cluster-buys" \
                   "https://www.secform4.com/insider-buying.htm" \
                   "https://huggingface.co/api/datasets?search=insider&limit=50" \
                   "https://huggingface.co/api/datasets?search=form%204&limit=50" \
                   "https://www.kaggle.com/api/v1/datasets/list?search=insider%20trading"; do
            echo "== $u"
            curl -sS -m 60 -A "Mozilla/5.0 (research)" -o body -w "HTTP %{http_code} %{size_download}\n" "$u"
            sed -e 's/<[^>]*>/ /g' body | tr -s ' \n' | head -c 1500; echo
            sleep 2
          done
          } > probe/sec3/report.txt 2>&1
          cat probe/sec3/report.txt
      - run: |
          git config user.name "probe bot"; git config user.email "actions@users.noreply.github.com"
          git add probe/sec3 && git commit -q -m "probe: sec3 [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
