name: round11
# Round 11 (PROTOCOL_ROUND11.md): multi-asset trend, walk-forward.
on:
  workflow_dispatch:
    inputs:
      small: {description: "1 = smoke test", default: "1"}
permissions:
  contents: write
concurrency: round11-${{ inputs.small }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R11_SMALL: ${{ inputs.small }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_round11.py
      - run: python run_round11.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round11 bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND11* || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "round11: results (run ${{ github.run_id }}, small=${{ inputs.small }})"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
