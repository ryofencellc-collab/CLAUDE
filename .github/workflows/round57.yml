name: round57
# Round 57 (PROTOCOL_ROUND57.md): AAA gas nowcast vs Kalshi daily gas markets.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - name: Smoke (planted edge passes, null fails; no network)
        run: python run_round57.py smoke
      - name: Collect Kalshi gas markets + trades
        run: R57_BUDGET_MIN=290 python run_round57.py collect
      - name: Analyze
        run: python run_round57.py analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r57-data, path: data/r57/}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round57 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND57.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round57: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
