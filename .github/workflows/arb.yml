name: arb
# Round 43 (PROTOCOL_ROUND43.md): riskless-arbitrage scanner, Kalshi + Polymarket. Self-chaining ~5.7 h jobs.
on:
  workflow_dispatch:
    inputs:
      seconds: {description: "run length", default: "20400"}
      chain: {description: "start the next job when done", default: "yes"}
permissions:
  contents: write
  actions: write
concurrency:
  group: arb
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      R43_COMMIT: "1"
      R43_SECONDS: ${{ inputs.seconds || '20400' }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "claude/eloquent-darwin-2lipsh"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: |
          git config user.name "arb bot"
          git config user.email "actions@users.noreply.github.com"
      - run: python -m edge.arb
      - name: Start the next job
        if: always() && (inputs.chain || 'yes') == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" != "success" ]; then sleep 120; fi
          for i in 1 2 3; do gh workflow run arb.yml --ref claude/eloquent-darwin-2lipsh && exit 0; sleep 20; done
