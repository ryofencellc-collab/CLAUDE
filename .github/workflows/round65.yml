name: round65
# Round 65 (PROTOCOL_ROUND65.md): Polymarket -> Kalshi hourly lead-lag on Fed decisions.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - name: Smoke (planted edge passes, null fails; no network)
        run: python run_round65.py smoke
      - name: Collect matched Fed pairs + histories
        run: python run_round65.py collect
      - name: Analyze
        run: python run_round65.py analyze
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: r65-data, path: data/r65/}
      - name: Commit report
        if: always()
        run: |
          git config user.name "round65 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND65.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round65: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
