name: round30
# Round 30 (PROTOCOL_ROUND30.md): chart indicators vs Kalshi 15-minute BTC/ETH markets.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - run: python run_round30.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round30 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND30.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round30: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
