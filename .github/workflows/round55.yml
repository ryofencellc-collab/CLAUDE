name: round55
# Round 55 (PROTOCOL_ROUND55.md): Reddit 0DTE SPX iron fly, model backtest calibrated on real Cboe quotes.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate scipy
      - uses: actions/cache@v4
        with:
          path: data/histdata
          key: histdata-spxusd-v1-${{ github.run_id }}
          restore-keys: |
            histdata-spxusd-v1-
            histdata-nsx-spx-v1-
      - run: PAIR=spxusd python fetch_nq.py
      - run: python run_round55.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round55 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND55.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round55: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
