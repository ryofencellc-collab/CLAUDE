name: round52
# Round 52 (PROTOCOL_ROUND52.md): NY/Asia session setups on S&P & Nasdaq micros, prop-firm scoring.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - uses: actions/cache@v4
        with:
          path: data/histdata
          key: histdata-nsx-spx-v1-${{ github.run_id }}
          restore-keys: |
            histdata-nsx-spx-v1-
            histdata-nsxusd-v1-
      - run: python fetch_nq.py
      - run: PAIR=spxusd python fetch_nq.py
      - run: ls data/histdata | head; ls data/histdata | wc -l
      - run: python run_round52.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round52 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND52.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round52: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
