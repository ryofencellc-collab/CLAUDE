name: round3-feasibility
on:
  push:
    paths: ["round3_backtest.py", ".github/workflows/round3.yml"]
  workflow_dispatch:
jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python round3_backtest.py
