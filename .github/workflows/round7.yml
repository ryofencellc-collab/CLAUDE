name: round7
on:
  push:
    paths: ["run_round7.py", "edge/round7.py", ".github/workflows/round7.yml"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  arb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: "wx-*", path: data/weather, merge-multiple: true, run-id: 40116008981, github-token: "${{ github.token }}"}
      - run: python run_round7.py arb
  tennis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt openpyxl
      - run: python run_round7.py tennis
  funding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run_round7.py funding
  pairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run_round7.py pairs
