name: round72
# Round 72 (PROTOCOL_ROUND72.md): SPY put credit spreads, daily or 3x/week, on Round 35's real chains.
on:
  workflow_dispatch:
    inputs:
      mode: {description: "sample | report", default: "sample"}
permissions:
  contents: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - uses: actions/download-artifact@v4
        with: {name: "opt-SPY", path: data/opt, run-id: "42507125705", github-token: "${{ github.token }}"}
      - run: ls -la data/opt
      - run: python run_round72.py ${{ inputs.mode || 'sample' }}
      - name: Commit report
        if: ${{ !cancelled() && inputs.mode == 'report' }}
        run: |
          git config user.name "round72 bot"; git config user.email "actions@users.noreply.github.com"
          git add -f reports/ROUND72.md data/r72_grid.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round72: results [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done
