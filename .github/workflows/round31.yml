name: round31
# Round 31 (PROTOCOL_ROUND31.md): theory factory on Kalshi 15-minute crypto markets with real 1-minute quotes.
on:
  workflow_dispatch:
    inputs:
      reuse_run: {description: "run id whose r31-* data to reuse (skip fetching)", default: ""}
permissions:
  contents: write
  actions: read
jobs:
  data:
    if: ${{ inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        series: [KXBTC15M, KXETH15M, KXSOL15M, KXXRP15M, KXDOGE15M]
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python run_round31.py data ${{ matrix.series }}
      - uses: actions/upload-artifact@v4
        with: {name: "r31-${{ matrix.series }}", path: data/r31/}
  run:
    needs: data
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run == '' }}
        with: {pattern: "r31-*", path: data/r31, merge-multiple: true}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run != '' }}
        with: {pattern: "r31-*", path: data/r31, merge-multiple: true, run-id: "${{ inputs.reuse_run }}", github-token: "${{ github.token }}"}
      - run: ls -la data/r31
      - run: python run_round31.py run
      - name: Commit report
        if: always()
        run: |
          git config user.name "round31 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND31.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round31: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
