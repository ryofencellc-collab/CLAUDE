name: paper18
# Round 18 forward paper test (PROTOCOL_ROUND18.md, "Forward test").
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: paper18
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m edge.paper18
      - name: Commit ledger
        run: |
          git config user.name "paper18 bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "paper18: ledger update $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
