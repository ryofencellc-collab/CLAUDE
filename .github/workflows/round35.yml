name: round35
# Round 35 backtest (PROTOCOL_ROUND35.md) on chains downloaded by round35_data.
on:
  workflow_dispatch:
    inputs:
      data_run: {description: "round35_data run id", required: true}
permissions:
  contents: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - uses: actions/download-artifact@v4
        with: {pattern: "opt-*", path: data/opt, merge-multiple: true, run-id: "${{ inputs.data_run }}", github-token: "${{ github.token }}"}
      - run: ls -la data/opt
      - run: python run_round35.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round35 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND35.md 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round35: results [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
