name: probe-data-sources
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: HistData NSXUSD 1-min
        continue-on-error: true
        run: |
          pip install -q histdata
          mkdir -p hd && cd hd
          python -c "
          from histdata import download_hist_data as dl
          from histdata.api import Platform as P, TimeFrame as TF
          for y, m in (('2012', None), ('2022', None), ('2026', '9')):
              try:
                  print(y, m, dl(year=y, month=m, pair='nsxusd', platform=P.GENERIC_ASCII, time_frame=TF.ONE_MINUTE))
              except Exception as e:
                  print('FAIL', y, m, repr(e))
          "
          ls -la
          for z in *.zip; do unzip -o -q "$z"; done
          ls -la; head -3 *.csv; wc -l *.csv
      - name: Dukascopy legacy datafeed
        continue-on-error: true
        run: |
          curl -sS -m 30 -o x.bi5 -w "%{http_code} %{size_download}\n" https://datafeed.dukascopy.com/datafeed/USATECHIDXUSD/2024/02/08/BID_candles_min_1.bi5
      - name: football-data.co.uk
        continue-on-error: true
        run: |
          curl -sSL -m 30 -A "Mozilla/5.0" -o e0.csv -w "%{http_code} %{size_download} %{url_effective}\n" https://www.football-data.co.uk/mmz4281/2324/E0.csv
          head -c 800 e0.csv; echo
          curl -sSL -m 30 -A "Mozilla/5.0" -o new.csv -w "%{http_code} %{size_download}\n" https://www.football-data.co.uk/new/BRA.csv
          head -c 300 new.csv; echo
