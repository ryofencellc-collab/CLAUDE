name: probe-data-sources
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kalshi historical endpoints
        continue-on-error: true
        run: |
          K=https://api.elections.kalshi.com/trade-api/v2
          for u in "$K/historical/markets?series_ticker=KXHIGHNY&limit=5" "$K/historical/cutoff" \
                   "$K/markets?series_ticker=KXHIGHNY&status=settled&limit=5&max_close_ts=1750000000" \
                   "$K/events?series_ticker=KXHIGHNY&status=settled&limit=5&min_close_ts=1700000000&max_close_ts=1750000000" \
                   "$K/markets?event_ticker=KXHIGHNY-25JUL01" "$K/markets?event_ticker=HIGHNY-24JUL01" \
                   "$K/historical/markets?event_ticker=KXHIGHNY-25JUL01" ; do
            echo "== $u"; curl -sS -m 30 "$u" | head -c 700; echo
          done
