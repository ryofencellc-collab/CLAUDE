name: round27
# Round 27 (PROTOCOL_ROUND27.md): scan every Kalshi series for the 99c maker edge, honestly counted.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: timeout 19800 python run_round27.py scan ${{ matrix.shard }} 8 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "r27-${{ matrix.shard }}", path: data/r27/}
  report:
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt tabulate
      - uses: actions/download-artifact@v4
        with: {pattern: "r27-*", path: data/r27, merge-multiple: true}
      - run: python run_round27.py report
      - name: Commit report
        if: always()
        run: |
          git config user.name "round27 bot"; git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND27.md reports/ROUND27.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -q -m "round27: scan report [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
