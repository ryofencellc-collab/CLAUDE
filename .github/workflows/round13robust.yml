name: round13robust
# Round 13 (PROTOCOL_ROUND13.md): three-stream portfolio, walk-forward.
on:
  workflow_dispatch:
    inputs:
      small: {description: "1 = smoke test", default: "1"}
permissions:
  contents: write
concurrency: round13robust-${{ inputs.small }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R13_SMALL: ${{ inputs.small }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_round13.py
      - run: python run_round13_robust.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "round13 bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ROUND13* || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "round13: stress audit (run ${{ github.run_id }}, small=${{ inputs.small }})"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
